name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: シークレット漏洩チェック
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks でシークレットスキャン
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: ビルド・テスト（プレースホルダー）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: プレースホルダーステップ
        run: |
          echo "使用する言語・フレームワークが決まったら、ここに lint / test / build コマンドを追加してください。"
          echo "例: npm ci && npm test / pip install -r requirements.txt && pytest など"
