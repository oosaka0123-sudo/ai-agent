name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: シークレット漏洩チェック
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks でシークレットスキャン
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-test:
    name: Python テスト（media_gen / mcp_server / onboarding）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: "pytest 実行（tests/: ネットワーク接続不要な単体テストのみ。Google/GitHub の実API呼び出しはすべてfake/stubに置き換え済み）"
        run: pytest tests/

      - name: Google Media MCP 再デプロイhelperのshell構文確認
        run: bash -n scripts/redeploy_google_media_mcp.sh

      - name: Steel Browser MCP 再デプロイhelperのshell構文確認
        run: bash -n scripts/redeploy_steel_browser_mcp.sh

      - name: Steel Browser GitHub WIF bootstrapのshell構文確認
        run: bash -n scripts/bootstrap_steel_github_wif.sh

      - name: Steel Browser MCP 受入試験helperのshell構文確認
        run: bash -n scripts/run_steel_acceptance_cloudshell.sh
