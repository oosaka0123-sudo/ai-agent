name: GPT Ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - deploy-pages
          - health-check
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: gpt-ops-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[GPT-OPS] ')
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.operation.outputs.value }}
    steps:
      - id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            op="$MANUAL_OPERATION"
          else
            op="${ISSUE_TITLE#'[GPT-OPS] '}"
          fi
          case "$op" in
            deploy-pages|health-check) ;;
            *)
              echo "Unsupported operation: $op" >&2
              exit 2
              ;;
          esac
          echo "value=$op" >> "$GITHUB_OUTPUT"

  health-check:
    needs: route
    if: needs.route.outputs.operation == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync public site data
        run: bash scripts/sync-site-data.sh
      - name: Validate key files
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f .github/workflows/pages.yml
          find competitions -type f -name '*.html' -print 2>/dev/null || true
      - name: Report success to issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue comment "$ISSUE" --repo "$REPO" --body "✅ GPT Ops health-check completed successfully."

  deploy-pages:
    needs: route
    if: needs.route.outputs.operation == 'deploy-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Sync public site data
        run: bash scripts/sync-site-data.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report success to issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: gh issue comment "$ISSUE" --repo "$REPO" --body "✅ GPT Ops deploy-pages completed: $PAGE_URL"
