name: GPT Ops

on:
  push:
    branches:
      - gpt-control
    paths:
      - ".gpt-ops/command.txt"

permissions:
  contents: read
  actions: write

concurrency:
  group: gpt-ops
  cancel-in-progress: false

jobs:
  read-command:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.read.outputs.operation }}
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4

      - name: Read operation
        id: read
        shell: bash
        run: |
          set -euo pipefail
          operation="$(tr -d '\r\n ' < .gpt-ops/command.txt)"
          case "$operation" in
            deploy-pages|health-check) ;;
            *)
              echo "Unsupported operation: $operation" >&2
              exit 2
              ;;
          esac
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  health-check:
    needs: read-command
    if: needs.read-command.outputs.operation == 'health-check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync public site data
        run: bash scripts/sync-site-data.sh

      - name: Validate key files
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f .github/workflows/pages.yml
          test -f .github/workflows/gpt-ops.yml
          find competitions -type f -name '*.html' -print 2>/dev/null || true

  deploy-pages:
    needs: read-command
    if: needs.read-command.outputs.operation == 'deploy-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch main Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
