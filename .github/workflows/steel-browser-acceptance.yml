name: Steel Browser Deploy and Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.steel-browser"
      - ".dockerignore"
      - "requirements.txt"
      - "mcp_server/steel_app.py"
      - "mcp_server/steel_browser/**"
      - ".github/workflows/steel-browser-acceptance.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: steel-browser-production
  cancel-in-progress: false

env:
  PROJECT_ID: rss7-ai-media
  PROJECT_NUMBER: "518404402696"
  REGION: us-central1
  SERVICE: steel-browser-mcp
  ARTIFACT_REPO: cloud-run-source-deploy
  WIF_PROVIDER: projects/518404402696/locations/global/workloadIdentityPools/github-actions-ai-agent/providers/steel-main
  DEPLOYER_SA: github-actions-steel-deployer@rss7-ai-media.iam.gserviceaccount.com

jobs:
  deploy-and-accept:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[deploy-google-media]')
    name: Deploy Steel and run real 5-step lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Docker authentication
        shell: bash
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Steel Browser image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile.steel-browser -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Update existing Cloud Run service image only
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --quiet

      - name: Verify Cloud Run readiness
        id: service
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          ready=false
          for _ in $(seq 1 10); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "$base/readyz" 2>/dev/null || true)"
            if [[ "$body" == *'"ready":true'* || "$body" == *'"ready": true'* ]]; then
              ready=true
              break
            fi
            sleep 3
          done
          [[ "$ready" == true ]]
          echo "Steel Browser /readyz: ready=true"

      - name: Request short-lived GitHub OIDC token for application acceptance
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=steel-browser-acceptance")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "Application acceptance OIDC token acquired."

      - name: Run Cloud Run self-acceptance endpoint
        shell: bash
        env:
          BASE_URL: ${{ steps.service.outputs.base }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS --connect-timeout 10 --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$body" -w '%{http_code}' \
            "${BASE_URL%/}/acceptance")"

          python3 - "$status" "$body" <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as fh:
              payload = json.load(fh)

          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if status != 200:
              raise SystemExit(f"acceptance endpoint returned HTTP {status}")
          if payload.get("ok") is not True or payload.get("result") != "ALL_PASS":
              raise SystemExit("Steel acceptance did not report ALL_PASS")

          expected = [
              "create_session",
              "navigate",
              "extract",
              "screenshot",
              "release_session",
          ]
          observed = [step.get("name") for step in payload.get("steps", [])]
          if observed != expected or any(step.get("status") != "pass" for step in payload["steps"]):
              raise SystemExit(f"unexpected acceptance steps: {observed}")

          print("Steel Browser MCP deploy + acceptance: ALL PASS")
          PY

  deploy-google-media:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-google-media]')
    name: Deploy Google Media MCP with approved WIF
    runs-on: ubuntu-latest
    env:
      SERVICE: google-media-mcp
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Verify Lite is the default before deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'DEFAULT_VIDEO_MODEL = "veo-3.1-lite-generate-001"' src/media_gen/providers/google_provider.py
          echo "Verified: Veo 3.1 Lite is the source default."

      - name: Authenticate to Google Cloud with approved keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Docker authentication
        shell: bash
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Capture current Google Media revision
        id: before
        shell: bash
        run: |
          set -Eeuo pipefail
          revision="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Current revision: $revision"

      - name: Build and push Google Media MCP image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -f Dockerfile -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Update Google Media Cloud Run image only
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail
          gcloud run services update "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --quiet

      - name: Verify new Google Media revision and readiness
        shell: bash
        env:
          BEFORE_REVISION: ${{ steps.before.outputs.revision }}
        run: |
          set -Eeuo pipefail
          after="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          url="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$after"
          test -n "$url"
          test "$after" != "$BEFORE_REVISION"
          echo "Ready revision: $after"
          echo "Service URL: $url"

          ready=false
          for _ in $(seq 1 10); do
            body="$(curl -fsS --connect-timeout 10 --max-time 20 "${url%/}/readyz" 2>/dev/null || true)"
            if [[ "$body" == *'"ready":true'* || "$body" == *'"ready": true'* ]]; then
              ready=true
              echo "$body"
              break
            fi
            sleep 3
          done
          [[ "$ready" == true ]]
          echo "Google Media MCP deploy: ready=true"
