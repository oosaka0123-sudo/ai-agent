name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "guides/**"
      - "docs/screenshots/**"
      - "scripts/sync-site-data.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: GitHub Pagesの設定を検証
        uses: actions/configure-pages@v5

      - name: 開発記録データ・スクリーンショットをサイトへ同期
        run: bash scripts/sync-site-data.sh

      - name: 公開用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
